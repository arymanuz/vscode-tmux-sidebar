<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Source for resources/icon-gallery.png (the marketplace gallery tile).
       Regenerate with: rsvg-convert -w 128 -h 128 -o resources/icon-gallery.png resources/icon-gallery.svg

       Unlike resources/icon.svg (the activity bar icon, which is transparent and
       uses currentColor), the gallery tile needs its own background and explicit
       colours because it is shown on both light and dark marketplace pages.

       The tile itself is the terminal window, so the artwork fills the whole
       square the way most gallery icons do; drawing a separate window outline
       inside the tile left a nested frame and a small glyph. Proportions match
       the activity bar icon: the status bar takes the bottom quarter. -->
  <rect width="128" height="128" rx="24" fill="#21262D"/>
  <g stroke="#E6EDF3" stroke-width="8" stroke-linecap="butt">
    <path d="M64 0 V96"/>
    <path d="M64 48 H128"/>
    <path d="M0 96 H128"/>
  </g>
  <rect x="18" y="105" width="30" height="10" rx="5" fill="#8DBF3F"/>
</svg>
