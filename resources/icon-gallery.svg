<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Source for resources/icon-gallery.png (the marketplace gallery tile).
       Regenerate with: rsvg-convert -w 128 -h 128 -o resources/icon-gallery.png resources/icon-gallery.svg

       Unlike resources/icon.svg (the activity bar icon, which is transparent and
       uses currentColor), the gallery tile needs its own background and explicit
       colours because it is shown on both light and dark marketplace pages.

       The window is drawn as a real outline rather than relying on the tile edge
       to imply it: the tile is dark, so on a dark page its edge disappears and
       only the inner dividers would remain visible. The outline is inset just
       8px so the artwork still fills the square. Proportions match the activity
       bar icon: the status bar takes the bottom quarter of the window. -->
  <rect width="128" height="128" rx="24" fill="#21262D"/>
  <g fill="none" stroke="#E6EDF3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="112" height="112" rx="16"/>
    <path d="M64 8 V92"/>
    <path d="M64 50 H120"/>
    <path d="M8 92 H120"/>
  </g>
  <rect x="20" y="101" width="28" height="10" rx="5" fill="#8DBF3F"/>
</svg>
