<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Source for resources/icon.png (the marketplace gallery tile).
       Regenerate with: rsvg-convert -w 128 -h 128 -o resources/icon.png resources/icon-gallery.svg
       Unlike resources/icon.svg (the activity bar icon, which is transparent and
       uses currentColor), the gallery tile needs its own background and explicit
       colours because it is shown on both light and dark marketplace pages. -->
  <rect width="128" height="128" rx="24" fill="#21262D"/>
  <g fill="none" stroke="#E6EDF3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="28" y="28" width="72" height="72" rx="8"/>
    <path d="M64 28 V82"/>
    <path d="M64 55 H100"/>
    <path d="M28 82 H100"/>
  </g>
  <rect x="37" y="88" width="17" height="6" rx="3" fill="#8DBF3F"/>
</svg>
